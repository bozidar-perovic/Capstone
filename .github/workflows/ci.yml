# Got this skeleton from the HSF training material
name: Running tests and code quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run tests and smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest

      - name: Add repository root to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Syntax smoke check
        run: python -m compileall src

      - name: Run pytest
        run: python -m pytest tests

  flake8-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Add repository root to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Run flake8
        run: flake8 src